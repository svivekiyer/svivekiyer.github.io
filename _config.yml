title: Vivek Iyer
tagline: Storage platform engineering — distributed systems and data protection
description: >-
  Storage platform engineering — distributed filesystems, data protection, and the software that operates them. Long-form writing, paired with code that runs anywhere.

url: "https://svivekiyer.github.io"
baseurl: ""

github_username: svivekiyer
github_url: "https://github.com/svivekiyer"
linkedin_url: "https://www.linkedin.com/in/svivekiyer/"

# No theme gem. The layouts and includes in this repository are the whole site,
# which keeps what is rendered and what is in the repo the same thing.

collections:
  articles:
    output: true
    permalink: /articles/:name/
  architecture:
    output: true
    permalink: /architecture/:name/
  tooling:
    output: true
    permalink: /tooling/:name/
  nuggets:
    output: true
    permalink: /nuggets/:name/

# Navigation. Entries carrying a `collection` key are hidden until that
# collection has something in it, so the site never advertises an empty room.
nav:
  - title: Articles
    url: /articles/
    collection: articles
  - title: Architecture
    url: /architecture/
    collection: architecture
  - title: Tooling
    url: /tooling/
    collection: tooling
  - title: Nuggets
    url: /nuggets/
    collection: nuggets
  - title: About
    url: /about/

defaults:
  - scope:
      path: ""
      type: articles
    values:
      layout: piece
      section: Articles
  - scope:
      path: ""
      type: architecture
    values:
      layout: piece
      section: Architecture
  - scope:
      path: ""
      type: tooling
    values:
      layout: piece
      section: Tooling
  - scope:
      path: ""
      type: nuggets
    values:
      layout: piece
      section: Nuggets

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
