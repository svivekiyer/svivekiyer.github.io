<footer class="site-foot">
  <div class="wrap">

    <p class="foot-who">
      <span class="mark" aria-hidden="true"></span>
      {{ site.title }} · {{ site.tagline }}
    </p>

    <p class="foot-links">
      <a href="{{ site.github_url }}">GitHub</a>
      <a href="{{ site.linkedin_url }}">LinkedIn</a>
    </p>

  </div>
</footer>
